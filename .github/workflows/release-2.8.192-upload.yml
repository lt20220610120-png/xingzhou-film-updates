name: Upload verified 2.8.192 installer
on:
  push:
    branches: [codex/release-2.8.192-final-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.191 --pattern Xingzhou-Film-Tencent-Setup-2.8.191.exe
          gh api "repos/$GH_REPO/contents/release-2.8.192-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.191.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='ad97e0d4c73728a1d046e4ea296d344326fe6e1a2084c5af49e613a0b71c638e'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104096894
          assert hashlib.sha256(data).hexdigest()=='328b747a04632a8a4445dca843c65a7e1fd6e0c46533e3a05fb9efa302c7c761'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.192.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.192.exe
          api=$(gh release view v2.8.192 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.192 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:328b747a04632a8a4445dca843c65a7e1fd6e0c46533e3a05fb9efa302c7c761"


