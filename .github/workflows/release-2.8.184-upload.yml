name: Upload verified 2.8.184 installer
on:
  push:
    branches: [codex/release-2.8.184-final-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.183 --pattern Xingzhou-Film-Tencent-Setup-2.8.183.exe
          gh api "repos/$GH_REPO/contents/release-2.8.184-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.183.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='05159df85b6481015576b846069468512dcf509ee4138bb19b09251274bca208'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104105018
          assert hashlib.sha256(data).hexdigest()=='e64ee67fa3eadb3074578717057b898402a23e6eb995cfab56c2f496b62136b9'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.184.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.184.exe
          api=$(gh release view v2.8.184 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.184 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:e64ee67fa3eadb3074578717057b898402a23e6eb995cfab56c2f496b62136b9"


