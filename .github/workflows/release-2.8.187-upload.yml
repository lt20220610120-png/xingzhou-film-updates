name: Upload verified 2.8.187 installer
on:
  push:
    branches: [codex/release-2.8.187-final-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.186 --pattern Xingzhou-Film-Tencent-Setup-2.8.186.exe
          gh api "repos/$GH_REPO/contents/release-2.8.187-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.186.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='3691528373bfebd59622cc45f5e0093ca4fcbf174ff22e93628ee9ac1637044e'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104108415
          assert hashlib.sha256(data).hexdigest()=='34692d3daeeae1c62d348d6c9e6b92a1534973c107f7449a9e64313da25cb709'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.187.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.187.exe
          api=$(gh release view v2.8.187 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.187 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:34692d3daeeae1c62d348d6c9e6b92a1534973c107f7449a9e64313da25cb709"


