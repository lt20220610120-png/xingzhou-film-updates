name: Upload verified 2.8.182 installer
on:
  push:
    branches: [codex/release-2.8.182-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.181 --pattern Xingzhou-Film-Tencent-Setup-2.8.181.exe
          gh api "repos/$GH_REPO/contents/release-2.8.182-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.181.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='e6ce726e852d255a3efe5f78f17bbcafedb4ad6db5fb574a621c802749a5c40a'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104097936
          assert hashlib.sha256(data).hexdigest()=='31d5371bdd82efcbd9bd80a82327db7dad86391c1acb2583b8d7152fe411d49c'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.182.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.182.exe
          api=$(gh release view v2.8.182 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.182 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:31d5371bdd82efcbd9bd80a82327db7dad86391c1acb2583b8d7152fe411d49c"


