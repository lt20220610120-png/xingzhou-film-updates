name: Upload verified 2.8.195 installer
on:
  push:
    branches: [codex/release-2.8.195-verified-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reconstruct and verify the paired immutable installer
        run: |
          set -euo pipefail
          gh release download v2.8.194 --pattern Xingzhou-Film-Tencent-Setup-2.8.194.exe
          gh api "repos/$GH_REPO/contents/release-2.8.195-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > delta.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.194.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='9f07f26df6f8a68c119c1044e337afb3650d08b149717cecd7609eca08ebd013'
          with zipfile.ZipFile('delta.zip') as bundle:
              changed=bundle.read('changed')
              data=b''.join((changed if source else old)[at:at+size]
                            for source,at,size in json.loads(bundle.read('chunks.json')))
          assert len(data)==95215007 and hashlib.sha256(data).hexdigest()=='339eca6108c4933e069996fe69292ba461abf5b385f911dfdb75c71da0c3ad5e'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.195.exe').write_bytes(data)
          PY
      - name: Upload the verified installer to its release draft
        run: |
          set -euo pipefail
          name='Xingzhou-Film-Tencent-Setup-2.8.195.exe'
          endpoint="repos/$GH_REPO/releases/454605147"
          tag="$(gh api "$endpoint" --jq .tag_name)"
          test "$tag" = v2.8.195
          existing="$(gh api "$endpoint" --jq ".assets[] | select(.name == \"$name\").digest")"
          if test -z "$existing"; then
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl --config - --fail --silent --show-error --connect-timeout 15 --max-time 240 -H 'Content-Type: application/octet-stream' --data-binary "@$name" "https://uploads.github.com/$GH_REPO_PATH/releases/454605147/assets?name=$name" >/dev/null
          fi
          test "$(gh api "$endpoint" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = 'sha256:339eca6108c4933e069996fe69292ba461abf5b385f911dfdb75c71da0c3ad5e'
        env:
          GH_REPO_PATH: repos/${{ github.repository }}