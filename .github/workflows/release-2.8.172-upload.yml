name: Upload verified 2.8.172 installer
on:
  push:
    branches: [codex/release-2.8.172-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.171 --pattern Xingzhou-Film-Tencent-Setup-2.8.171.exe
          gh api "repos/$GH_REPO/contents/release-2.8.172-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.171.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='299e79da951c1c083cb787c2edcc29e3f4bb38e2e0f9a23fcb35ffebf7ee150c'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104131082
          assert hashlib.sha256(data).hexdigest()=='d7f2353118d9f25b1bb354f9eab6314bb52e203853c5e696610f8ba76be74fa0'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.172.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.172.exe
          api=$(gh release view v2.8.172 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.172 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:d7f2353118d9f25b1bb354f9eab6314bb52e203853c5e696610f8ba76be74fa0"


