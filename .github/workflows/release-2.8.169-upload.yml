name: Upload verified 2.8.169 installer
on:
  push:
    branches: [codex/release-2.8.169-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.168 --pattern Xingzhou-Film-Tencent-Setup-2.8.168.exe
          gh api "repos/$GH_REPO/contents/release-2.8.169-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.168.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='0ed39b7644ce3e8ad1159c7d581a4a2ecdd8bced405f2c44b15ed1b4e2f76f46'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104126999
          assert hashlib.sha256(data).hexdigest()=='8608abc6ea0d47f0ceeb0a7a8be1ef2fc276809ddc301fcc1959faee23fb750f'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.169.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.169.exe
          api=$(gh release view v2.8.169 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.169 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:8608abc6ea0d47f0ceeb0a7a8be1ef2fc276809ddc301fcc1959faee23fb750f"


