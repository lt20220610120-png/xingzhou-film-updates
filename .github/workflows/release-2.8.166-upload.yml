name: Upload verified 2.8.166 installer
on:
  push:
    branches: [codex/release-2.8.166-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.165 --pattern Xingzhou-Film-Tencent-Setup-2.8.165.exe
          gh api "repos/$GH_REPO/contents/release-2.8.166-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.165.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='4b05d1fa1e1da4de8cac024f25cc65db3321217ea67afb6e4a2dd2ca0d59011c'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104121579
          assert hashlib.sha256(data).hexdigest()=='013610afdb107f41380d4328413043581ad09f63cd73833cb26c1a10ed320778'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.166.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.166.exe
          api=$(gh release view v2.8.166 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.166 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:013610afdb107f41380d4328413043581ad09f63cd73833cb26c1a10ed320778"


