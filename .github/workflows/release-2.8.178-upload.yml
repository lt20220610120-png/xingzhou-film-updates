name: Upload verified 2.8.178 installer
on:
  push:
    branches: [codex/release-2.8.178-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Restore and verify installer from published baseline
        shell: bash
        run: |
          set -euo pipefail
          gh release download v2.8.177 --pattern Xingzhou-Film-Tencent-Setup-2.8.177.exe
          gh api "repos/$GH_REPO/contents/release-2.8.178-delta.zip?ref=$GITHUB_REF_NAME" -H 'Accept: application/vnd.github.raw' > release-delta.zip
          python3 -u - <<'PY'
          import hashlib,json,pathlib,zipfile
          old=pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.177.exe').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='f5bf0c5ea4dc0914dec5be44bf4cb9d2ae08b1f5e6f636b8fa1f6e461b697ab2'
          with zipfile.ZipFile('release-delta.zip') as bundle:
              changed=bundle.read('changed')
              chunks=json.loads(bundle.read('chunks.json'))
              data=b''.join((changed if source else old)[at:at+size] for source,at,size in chunks)
          assert len(data)==104152059
          assert hashlib.sha256(data).hexdigest()=='c68c9fc1d8574578fa2cb280e1ee0f142d7b94e021a68526420f3e4acd0d1ace'
          pathlib.Path('Xingzhou-Film-Tencent-Setup-2.8.178.exe').write_bytes(data)
          print('Installer SHA256 verified',flush=True)
          PY
      - name: Upload verified installer to draft release
        shell: bash
        run: |
          set -euo pipefail
          name=Xingzhou-Film-Tencent-Setup-2.8.178.exe
          api=$(gh release view v2.8.178 --json apiUrl --jq .apiUrl)
          existing=$(gh api "$api" --jq ".assets[] | select(.name == \"$name\").state")
          if test -z "$existing"; then gh release upload v2.8.178 "$name"; fi
          test "$(gh api "$api" --jq ".assets[] | select(.name == \"$name\" and .state == \"uploaded\").digest")" = "sha256:c68c9fc1d8574578fa2cb280e1ee0f142d7b94e021a68526420f3e4acd0d1ace"


